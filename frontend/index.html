<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>语音实时字幕</title>
  <script src="/static/vendor/vue.global.prod.js"></script>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: #f4f3ee;
      color: #1a1b1c;
    }
    .wrap {
      max-width: 720px;
      margin: 32px auto;
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    h2 { font-size: 15px; margin: 20px 0 8px; }
    .hint { color: #6b7280; font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
    .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: #2f6fed;
      color: #fff;
      cursor: pointer;
    }
    button.on { background: #d4380d; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { color: #5b6472; font-size: 13px; }
    .error { color: #c0392b; font-size: 13px; margin: 8px 0 0; }
    .partial {
      min-height: 28px;
      margin: 16px 0 0;
      padding: 12px;
      border-radius: 10px;
      background: #f7f8fb;
      color: #1a1b1c;
      line-height: 1.6;
    }
    .partial.empty { color: #9aa1ab; }
    ul { margin: 0; padding-left: 18px; line-height: 1.7; }
    li + li { margin-top: 4px; }
  </style>
</head>
<body>
  <div id="app" class="wrap">
    <h1>语音实时字幕</h1>
    <p class="hint">
      必须用 localhost 或 HTTPS 打开。页面默认关闭语音，点「开启语音」后才会使用麦克风。说话时中间结果会刷新，停顿后定稿留在下方。
    </p>
    <div class="bar">
      <button
        type="button"
        :class="{ on: active }"
        :disabled="!health.ready && !active && !starting"
        @click="toggle"
      >{{ buttonLabel }}</button>
      <span class="status">{{ status }}</span>
    </div>
    <p v-if="error" class="error">{{ error }}</p>
    <p class="partial" :class="{ empty: !partial }">{{ partial || "当前句会显示在这里" }}</p>
    <h2>已定稿</h2>
    <p v-if="!finals.length" class="hint">还没有定稿。</p>
    <ul v-else>
      <li v-for="(line, index) in finals" :key="index">{{ line }}</li>
    </ul>
  </div>
  <script type="module">
    import { createVoiceSession } from "/static/voice-session.js";

    const { createApp, computed, onBeforeUnmount, onMounted, ref } = Vue;

    createApp({
      setup() {
        const health = ref({ ready: false, provider: "", model: "", reason: "正在检查语音服务…" });
        const active = ref(false);
        const starting = ref(false);
        const status = ref("");
        const error = ref("");
        const partial = ref("");
        const finals = ref([]);
        const session = createVoiceSession({
          onHealth(next) { health.value = next; },
          onActive(on) {
            active.value = on;
            starting.value = false;
          },
          onStatus(text) {
            status.value = text;
            starting.value = text === "连接中…";
          },
          onError(text) { error.value = text; },
          onPartial(text) { partial.value = text; },
          onFinal(text) {
            if (text) finals.value = finals.value.concat(text);
            partial.value = "";
          },
        });

        const buttonLabel = computed(() => {
          if (starting.value) return "连接中…";
          if (active.value) return "关闭语音";
          return "开启语音";
        });

        function toggle() {
          void session.toggle();
        }

        onMounted(() => {
          void session.refreshHealth();
        });
        onBeforeUnmount(() => {
          void session.stop();
        });

        return { health, active, starting, status, error, partial, finals, buttonLabel, toggle };
      },
    }).mount("#app");
  </script>
</body>
</html>
