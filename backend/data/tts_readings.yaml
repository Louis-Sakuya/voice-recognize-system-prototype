# 朗读读法。改文件后下一次合成生效。不要复用 ASR 谐音表。
# 长词写在短词前面，避免 FastAPI 先被拆成 Fast + API。
readings:
  - pattern: "FastAPI"
    replace: "Fast API"
  - pattern: "wx-iecm"
    replace: "网信智能平台"
  - pattern: "Xinference"
    replace: "X inference"
  - pattern: "SenseVoice"
    replace: "Sense Voice"
  - pattern: "FunASR"
    replace: "Fun ASR"
  - pattern: "Paraformer"
    replace: "Para former"
  - pattern: "pgvector"
    replace: "pg vector"
  - pattern: "OpenAI"
    replace: "Open AI"
  - pattern: "\\bRAG\\b"
    replace: "R A G"
  - pattern: "(?<!Fast )\\bAPI\\b"
    replace: "A P I"
  - pattern: "(?<!Fun )\\bASR\\b"
    replace: "A S R"
  - pattern: "Redis"
    replace: "Redis"
  - pattern: "Celery"
    replace: "Celery"
  - pattern: "gateway"
    replace: "gateway"
